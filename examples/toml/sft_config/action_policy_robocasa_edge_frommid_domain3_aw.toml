# ============================================================================
# RoboCasa 24-task SFT on Cosmos3-Edge — "dom3-aw": domain-3 head + action-weighted
# early budget. The arm built to make the EgoVerse warm start WIN on action loss.
#
# Two measured facts it combines:
#   1. dom3 (unscaled domain-3 head) is the ONLY arm that starts below base --
#      0.3971 vs 0.4622 at step 100 (-14.1%). Its failure was the descent, not the
#      start: +11.9% by step 200, +9.4% by 300.
#   2. The descent is decided in the first ~2K steps. Global grad norm there is
#      2.7-2.8 against grad_clip.clip_norm=1.0, so the step is renormalised and the
#      loss weights decide how that unit budget splits between video and action. By
#      5K the norm is 0.86 and clipping stops firing -- which is exactly where the
#      base-vs-mid gap stops shrinking (+2%, flat to 20K).
# So: keep the low start, and spend the clipped early budget on action.
#   action_loss_weight 10 -> 30, loss_scale (vision) 10 -> 5   (1:1 -> 6:1)
#
# EVAL MUST USE DOMAIN_NAME=hand_pose.
#
# Env: ROBOCASA_ROOT, EGOVERSE_EDGE_LOAD_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT
# ============================================================================

[job]
task         = "vfm"
experiment   = "action_policy_robocasa_edge_frommid_domain3_aw"
project      = "cosmos3_action"
group        = "action_sft"
name         = "action_policy_robocasa_edge_frommid_domain3_aw"
wandb_mode   = "online"

[model]
precision = "bfloat16"

[model.parallelism]
# Set for the shipped 3-node jobs: HSDP shards the model 8-way inside a node over
# NVLink and replicates 3-way across nodes -> 24 ranks, global batch
# max_samples_per_batch(16) x 24 = 384. For a single node set replicate = 1
# (global batch 128). dp_shard * dp_replicate MUST equal world_size.
#
# These MUST live here, not on the CLI: `[model]` is a structured node, so a
# trailing `-- model.parallelism.data_parallel_replicate_degree=3` dies with
# `ConfigKeyError: Key 'parallelism' is not in struct` at rank 0 and takes the whole
# job down at rendezvous. (`trainer.*` / `dataloader_train.*` overrides DO work.)
#
# Measured: 5.0 s/iter at 16 samples/rank -> ~28 h for the 20K iters below.
# (25/rank also fits — 7.9 s/iter, 43.1 GB — and at 3 nodes would match the
# Cosmos-Policy arm exactly on iters, global batch and epochs; ~44 h.)
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 3

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
# Same invariant as the base arm: cycle_lengths INCLUDES warm_up_steps and MUST
# equal trainer.max_iter. cycle < max_iter kills the run with a TypeError at the
# very end; cycle > max_iter stops it at a still-high LR.
cycle_lengths = [20000]
warm_up_steps = [500]

[trainer]
max_iter     = 20000
logging_iter = 50

[checkpoint]
load_path = "${oc.env:EGOVERSE_EDGE_LOAD_PATH}"
save_iter = 5000
