# ============================================================================
# PushT 2D action-policy SFT — run config for the `action_policy_pusht_nano`
# experiment. Recipe knobs (optimizer/lr, scheduler, grad_clip, count-based
# batch, action-head skip-on-load, dataset knobs) live in the registered
# experiment; this file only sets run-level scalars.
#
# Env required:
#   PUSHT_ROOT=/path/to/pusht_lerobot/success      # LeRobot v3.0 dataset root
#   BASE_CHECKPOINT_PATH=<Cosmos3-Nano DCP dir>     # convert_model_to_dcp output
#   WAN_VAE_PATH=<Wan2.2_VAE.pth>
#   IMAGINAIRE_OUTPUT_ROOT=/path/to/output_root     # persist checkpoints
# ============================================================================

[job]
task         = "vfm"
experiment   = "action_policy_pusht_nano"
project      = "cosmos3_action"
group        = "action_sft"
name         = "action_policy_pusht_repro"
wandb_mode   = "online"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 8    # set to your GPU count (1 for single-GPU)
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [40000]   # 2x max_iter

[trainer]
max_iter     = 20000
logging_iter = 50

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 2000

# PushT frames are small (256p, ~1:1), so the 128/rank count-based batch from the
# experiment is fine on H200/H100. On smaller GPUs, lower it at launch:
#   --opts dataloader_train.max_samples_per_batch=32
