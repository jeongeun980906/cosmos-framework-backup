# 2-GPU SMOKE for GR1 post-training 1x (action_policy_gr1_posttrain_1x_nano): validates
# the full loop with use_state (state0-prepend) AND the 3-cam concat_view (video H=384 =
# front_1+sideleft+sideright). Warm-starts from the EgoVerse 10k checkpoint; drops moe_gen
# from the optimizer so the state fits on 2 GPUs (forward still runs the full model).

[job]
task         = "vfm"
experiment   = "action_policy_gr1_posttrain_1x_nano"
project      = "cosmos3_action"
group        = "action_sft"
name         = "action_policy_gr1_posttrain_1x_smoke"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 2
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
keys_to_select = ["time_embedder", "vae2llm", "llm2vae", "action2llm", "llm2action", "action_modality_embed"]

[dataloader_train]
max_samples_per_batch = 2

[scheduler]
cycle_lengths = [3]
warm_up_steps = [0]

[trainer]
max_iter     = 3
logging_iter = 1

[checkpoint]
load_path = "${oc.env:POSTTRAIN_LOAD_PATH}"
save_iter = 100
