# GR1 v6 ICL post-train FROM the Edge v10 ICL mid checkpoint (stage 2).
# EDGE_MID_LOAD_PATH must point at the mid DCP dir (e.g. .../iter_000010000).
# Loads generation + action heads (keys_to_skip_loading=[]).

[job]
task         = "vfm"
experiment   = "action_policy_gr1_v6_icl_edge_frommid"
project      = "cosmos3_action"
group        = "action_sft"
name         = "action_policy_gr1_v6_icl_edge_frommid"
wandb_mode   = "online"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 3

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [8000]
warm_up_steps = [500]

[trainer]
max_iter     = 8000
logging_iter = 50

[checkpoint]
load_path = "${oc.env:EDGE_MID_LOAD_PATH}"
save_iter = 1000
