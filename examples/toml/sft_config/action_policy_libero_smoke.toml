# ============================================================================
# SMOKE config for `action_policy_libero_nano` — 10 iters, 2-way FSDP shard,
# wandb off. For config/data/checkpoint sanity, NOT a real run.
# Real runs: examples/toml/sft_config/action_policy_libero_repro.toml
#
# Env required:
#   LIBERO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT
# Launch: see examples/launch_sft_action_policy_libero.sh header (the smoke
# block also lowers max_samples_per_batch and disables EMA to fit memory).
# ============================================================================

[job]
task         = "vfm"
experiment   = "action_policy_libero_nano"
project      = "cosmos3_action"
group        = "action_sft"
name         = "action_policy_libero_smoke"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 2    # 2-way FSDP shard (Nano 8B doesn't fit on 1 GPU)
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [10]   # match max_iter

[trainer]
max_iter     = 10
logging_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 10
